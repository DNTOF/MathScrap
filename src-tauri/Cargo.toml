[package]
name = "mathscrap"
version = "0.0.1"
description = "Kraft-paper math scrapbook: Freeform-like sheet, shared plot, geometry inference (Rust/WASM)."
authors = ["DNTOF"]
license = "Apache-2.0"
edition = "2021"
default-run = "mathscrap"
rust-version = "1.90"

[lib]
name = "mathscrap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
mcpserve = { path = "../crates/mcpserve" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
