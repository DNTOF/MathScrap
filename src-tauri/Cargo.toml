[package]
name = "mathscrap"
version = "0.0.1"
description = "Kraft-paper math scrapbook: Freeform-like sheet, shared plot, geometry inference (Rust/WASM)."
authors = ["DNTOF"]
license = "Apache-2.0"
edition = "2021"
default-run = "mathscrap"
rust-version = "1.90"

[lib]
name = "mathscrap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
mcpserve = { path = "../crates/mcpserve" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
# opt-in native CoMER pipeline (round 3): compiled only with the `native-ocr` feature
comer-native = { path = "../crates/comer-native", default-features = false, optional = true }

[features]
native-ocr = ["dep:comer-native", "comer-native/ort"]

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
