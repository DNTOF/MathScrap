name: package

# Change-aware CI. The scope job classifies the diff (scripts/ci-scope.mjs):
#   docs       consistency checks only; no math suite, no packages
#   version    consistency checks; packages build on push to main (release bump)
#   packaging  consistency checks plus real package builds (also on pull requests); no math suite
#   full       the whole math suite, then packages on push to main
# Mixed or unclassified changes are full. ci-ok is the single status to require:
# skipped jobs pass it, failed or cancelled jobs fail it.
on:
  push:
    branches:
      - main
      - cursor/mathscrap-packaging-*
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sign_windows:
        description: Import WINDOWS_CERTIFICATE and sign the EXE
        type: boolean
        default: false
      sign_android:
        description: Sign the release APK with ANDROID_KEY_*
        type: boolean
        default: false
      build_ios:
        description: Build the unsigned iOS IPA (TrollStore / jailbreak sideload only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Classify changes
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-scope.mjs

  # Lightweight consistency checks. They run for every change, in seconds.
  checks:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check recorded versions
        run: node scripts/ci-version-check.mjs
      - name: Classifier regression
        run: node scripts/ci-scope-smoke.mjs
      - name: Packaging script syntax
        run: |
          for f in scripts/package-*.sh; do bash -n "$f"; echo "ok $f"; done
          for f in scripts/*.mjs; do node --check "$f"; done
          set +e
          bash scripts/package-ios.sh --unsigned > /tmp/ios.txt 2>&1
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then cat /tmp/ios.txt; echo "package-ios.sh on Linux should stop with exit 3, got $code"; exit 1; fi
      - name: Workflow YAML
        run: |
          python3 - <<'PY'
          import glob, yaml
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              with open(path, encoding='utf-8') as fh:
                  doc = yaml.safe_load(fh)
              assert isinstance(doc, dict) and doc.get('jobs'), path
              print('ok', path)
          PY

  # The math suite. Only for full changes.
  test:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/mathcore
      - name: Chrome for sheet end-to-end
        run: |
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1; then
            sudo apt-get update
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y /tmp/chrome.deb
          fi
          (google-chrome --version || google-chrome-stable --version)
      - run: npm ci
      - run: npm run lint
      - run: npm run test:rust
      - name: Packaged MCP protocol
        run: cargo test --manifest-path crates/mcpserve/Cargo.toml
      - run: npm run smoke
      - run: npm run smoke:ocr
      - name: Real CoMER smoke
        run: npx tsx scripts/ocr-real-smoke.ts
      - run: npm run smoke:ai
      - run: npm run test:pack
      - run: npm run smoke:ink
      - name: Ink unit tests
        run: npx tsx --test src/ink/*.test.ts
      - name: Start the dev server
        run: |
          npm run dev > dev-server.log 2>&1 &
          echo $! > dev-server.pid
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:47321/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "dev server did not start"
          cat dev-server.log
          exit 1
      - name: Sheet end-to-end
        env:
          SHOTS: e2e-shots
        run: npm run e2e:sheet
      - name: Ink gestures
        env:
          SHOTS: e2e-shots
        run: npm run e2e:ink
      - name: Per-formula plot end-to-end
        env:
          SHOTS: e2e-plots
        run: npm run e2e
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mathscrap-test-failure
          path: |
            e2e-shots
            e2e-plots
            dev-server.log
          if-no-files-found: ignore

  web:
    needs: [scope, checks, test]
    if: >-
      !cancelled() && needs.scope.result == 'success' && needs.checks.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.scope.outputs.mode != 'docs') ||
       (github.event_name == 'pull_request' && needs.scope.outputs.mode == 'packaging'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pack:web
      - uses: actions/upload-artifact@v4
        with:
          name: mathscrap-web-dist
          path: dist
          if-no-files-found: error

  android:
    needs: [scope, checks, test]
    if: >-
      !cancelled() && needs.scope.result == 'success' && needs.checks.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.scope.outputs.mode != 'docs') ||
       (github.event_name == 'pull_request' && needs.scope.outputs.mode == 'packaging'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Debug APK
        if: github.event_name != 'workflow_dispatch' || !inputs.sign_android
        run: bash scripts/package-android.sh --debug --install-sdk
      - name: Release APK
        if: github.event_name == 'workflow_dispatch' && inputs.sign_android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: bash scripts/package-android.sh --release --install-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: mathscrap-android
          path: |
            packaging/out/*.apk
            packaging/out/SHA256SUMS
          if-no-files-found: error

  windows:
    needs: [scope, checks, test]
    if: >-
      !cancelled() && needs.scope.result == 'success' && needs.checks.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.scope.outputs.mode != 'docs') ||
       (github.event_name == 'pull_request' && needs.scope.outputs.mode == 'packaging'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Import Authenticode certificate
        if: github.event_name == 'workflow_dispatch' && inputs.sign_windows
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            Write-Error "sign_windows was set but WINDOWS_CERTIFICATE or WINDOWS_CERTIFICATE_PASSWORD is empty."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx | Out-Null
          Remove-Item certificate/tempCert.txt
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $imported = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($imported.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Remove-Item -Recurse -Force certificate
      - name: Unsigned or signed installer
        shell: bash
        run: bash scripts/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mathscrap-windows
          path: |
            packaging/out/*.exe
            packaging/out/*.msi
            packaging/out/SHA256SUMS
          if-no-files-found: error

  ios:
    needs: [scope, checks, test]
    if: >-
      !cancelled() && needs.scope.result == 'success' && needs.checks.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.scope.outputs.mode != 'docs') ||
       (github.event_name == 'pull_request' && needs.scope.outputs.mode == 'packaging')) &&
      (github.event_name != 'workflow_dispatch' || inputs.build_ios)
    uses: ./.github/workflows/package-ios.yml
    with:
      target: unsigned

  # One SHA256SUMS over every package, next to the per-job sums.
  checksums:
    needs: [android, windows, ios]
    if: >-
      !cancelled() && needs.android.result == 'success' && needs.windows.result == 'success' &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: mathscrap-*
          path: artifacts
      - name: Verify per-job sums and combine
        run: |
          mkdir -p release
          for d in artifacts/mathscrap-android artifacts/mathscrap-windows artifacts/mathscrap-ios; do
            [ -d "$d" ] || continue
            (cd "$d" && sha256sum -c --ignore-missing SHA256SUMS)
            find "$d" -maxdepth 1 -type f ! -name SHA256SUMS ! -name 'PROVENANCE*' -exec cp {} release/ \;
          done
          node scripts/checksum-artifacts.mjs release
      - uses: actions/upload-artifact@v4
        with:
          name: mathscrap-release-checksums
          path: release/SHA256SUMS
          if-no-files-found: error

  # The one status to require on main. Skipped jobs pass; failed or cancelled jobs fail.
  ci-ok:
    if: always()
    needs: [scope, checks, test, web, android, windows, ios, checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS)
            let bad = 0
            for (const [name, job] of Object.entries(needs)) {
              console.log(name.padEnd(10), job.result)
              if (job.result === "failure" || job.result === "cancelled") bad++
            }
            if (needs.scope.result !== "success") bad++
            process.exit(bad ? 1 : 0)
          '
